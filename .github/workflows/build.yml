name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build NowcastPure with native csc.exe
      shell: powershell
      run: |
        powershell -ExecutionPolicy Bypass -File build.ps1
        if (-not (Test-Path NowcastPure.exe)) {
            throw "NowcastPure.exe build failed"
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: NowcastPure
        path: NowcastPure.exe

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: NowcastPure.exe
        draft: false
        prerelease: false
        generate_release_notes: true
